<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הובלה במערכות חיות | משימת מיפוי - מדעים כיתה ח'</title>
<style>
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#1f2a37; --ink2:#4b5a6a;
  --primary:#0369a1; --primary2:#0284c7; --primary-soft:#e0f2fe;
  --accent:#dc2626; --good:#15803d; --good-soft:#dcfce7; --bad-soft:#fee2e2;
  --warn:#b45309; --warn-soft:#fef3c7; --line:#d8e0e8; --chip:#eef2f6;
  --shadow:0 2px 10px rgba(15,40,70,.08);
}
html[data-theme="dark"]{
  --bg:#0e1622; --card:#16222f; --ink:#e8eef5; --ink2:#a9b8c7;
  --primary:#38bdf8; --primary2:#0ea5e9; --primary-soft:#0c2a3d;
  --accent:#f87171; --good:#4ade80; --good-soft:#12351f; --bad-soft:#3d1414;
  --warn:#fbbf24; --warn-soft:#3a2c07; --line:#2a3a4b; --chip:#1e2d3d;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;line-height:1.65;font-size:16px}
header.app{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:14px 16px;box-shadow:var(--shadow)}
header.app h1{margin:0;font-size:1.35rem}
header.app .sub{font-size:.85rem;opacity:.92;margin-top:2px}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:.95rem;padding:9px 14px;transition:transform .05s}
button:active{transform:scale(.97)}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.3)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary2)}
.btn-good{background:var(--good);color:#fff}
.btn-line{background:var(--card);color:var(--primary);border:1.5px solid var(--primary)}
.btn-line:hover{background:var(--primary-soft)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;max-width:960px;margin:10px auto 0;padding:0 4px;-webkit-overflow-scrolling:touch}
nav.tabs button{flex:0 0 auto;background:transparent;color:var(--ink2);border-radius:10px 10px 0 0;padding:10px 16px;font-weight:600;border-bottom:3px solid transparent}
nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--card)}
main{max-width:960px;margin:0 auto;padding:14px 12px 60px}
section.page{display:none}
section.page.active{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:1.2rem;color:var(--primary)}
.card h3{margin:14px 0 6px;font-size:1.05rem}
.muted{color:var(--ink2);font-size:.9rem}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 12px;font-size:.8rem;margin:2px 4px 2px 0;color:var(--ink2)}
.pill.p1{background:var(--good-soft);color:var(--good)}
.pill.p2{background:var(--warn-soft);color:var(--warn)}
.pill.p3{background:var(--bad-soft);color:var(--accent)}
.pill.skill{background:var(--primary-soft);color:var(--primary)}
.progress-wrap{background:var(--chip);border-radius:999px;height:10px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--good));border-radius:999px;transition:width .4s}
.qcard{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:var(--card)}
.qcard.answered-correct{border-color:var(--good)}
.qcard.answered-wrong{border-color:var(--accent)}
.qtext{font-weight:600;margin-bottom:10px}
.qmeta{margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:right;background:var(--chip);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;width:100%;color:var(--ink);font-size:.98rem}
.opt:hover{border-color:var(--primary2)}
.opt.correct{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--accent)}
.opt.disabled{opacity:.75;cursor:default}
.opt .letter{font-weight:700;color:var(--primary);flex:0 0 auto}
.feedback{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:.93rem}
.feedback.good{background:var(--good-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback .why-wrong{margin-top:6px;font-size:.88rem;color:var(--ink2)}
.explain{background:var(--primary-soft);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:.93rem}
.explain b{color:var(--primary)}
.hint-box{background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.9rem}
.q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea.ans{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:.95rem;background:var(--bg);color:var(--ink);resize:vertical}
table.cmp{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:8px 10px;text-align:right}
table.cmp th{background:var(--primary-soft);color:var(--primary)}
.lesson-img{width:100%;max-width:520px;display:block;margin:10px auto}
svg.diagram{width:100%;height:auto;display:block}
.lab-zone{background:var(--chip);border-radius:12px;padding:14px;margin-top:10px}
.lab-zone h4{margin:0 0 8px;color:var(--primary)}
.flow-btn{display:inline-block;margin:4px;padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.flow-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
.session-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.session-num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.session-done .session-num{background:var(--good)}
.subtabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.subtabs button{background:var(--chip);color:var(--ink2);border-radius:999px;padding:7px 16px}
.subtabs button.active{background:var(--primary);color:#fff}
.match-item{display:inline-block;margin:4px;padding:8px 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.match-item.sel{border-color:var(--primary);background:var(--primary-soft)}
.match-item.locked{background:var(--good-soft);border-color:var(--good);cursor:default}
.result-hero{text-align:center;padding:10px}
.result-hero .big{font-size:2.6rem;font-weight:800;color:var(--primary)}
.domain-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.domain-row .lbl{flex:0 0 110px;font-size:.9rem}
.domain-row .bar{flex:1;background:var(--chip);border-radius:999px;height:12px;overflow:hidden}
.domain-row .fill{height:100%;background:var(--primary2);border-radius:999px}
.domain-row .pct{flex:0 0 52px;font-size:.85rem;color:var(--ink2);text-align:left}
.timer{font-size:1.1rem;font-weight:700;color:var(--accent)}
input[type=number],input[type=text]{font-family:inherit;font-size:1rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:110px}
.range-row{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
input[type=range]{flex:1;min-width:140px}
details.tip{margin:8px 0}
details.tip summary{cursor:pointer;color:var(--primary);font-weight:600}
.callout{border-right:4px solid var(--primary);background:var(--primary-soft);padding:10px 14px;border-radius:8px;margin:10px 0}
.callout.warn{border-right-color:var(--warn);background:var(--warn-soft)}
.callout.err{border-right-color:var(--accent);background:var(--bad-soft)}
.footer-note{text-align:center;color:var(--ink2);font-size:.8rem;margin-top:24px}
@media (max-width:600px){
  body{font-size:15px}
  header.app h1{font-size:1.15rem}
  .domain-row .lbl{flex-basis:86px}
  .card{padding:13px 14px}
}
</style>
</head>

<script>
"use strict";
/* ============================ נתוני מפגשים ============================ */
const SESSIONS=[
{n:1,title:"אבחון",goal:"למצוא את החורים בלי ללמד מראש",dur:"25–35 דקות",lab:"mistakes",success:"כל טעות סווגה: לא ידעתי / התבלבלתי / לא הבניתי את השאלה",
lesson:`<h3>מה עושים כאן?</h3>
<p>לפני שלומדים — בודקים מה כבר יודעים. האבחון הוא <b>לא מבחן לציון</b>. המטרה שלו היא למצוא איפה יש פערים, כדי שהלימוד יהיה ממוקד ולא חזרה על מה שאתה כבר יודע.</p>
<div class="callout"><b>איך עובדים?</b> עונה על 12 השאלות באבחון בכנות, בלי לחפש תשובות. בסוף מקבלים פירוט לפי תחומים: ידע, תרשימים, השוואה, הסבר מדעי ויישום.</div>
<h3>שלושה סוגי טעויות</h3>
<p>אחרי האבחון מסמנים לכל טעות את הסוג שלה:</p>
<ul>
<li><b>לא ידעתי</b> — פשוט חסרה לי העובדה. פתרון: ללמוד את הנושא במפגש המתאים.</li>
<li><b>התבלבלתי</b> — ידעתי, אבל בחרתי תשובה אחרת (למשל עורק מול וריד). פתרון: לחזור על ההבדל בין המושגים.</li>
<li><b>לא הבניתי את השאלה</b> — קראתי לא מדויק או לא הבנתי את התרשים. פתרון: לתרגל קריאת שאלות ותרשימים (מפגש 9).</li>
</ul>
<div class="callout warn"><b>טעות נפוצה:</b> לדלג על האבחון כי "זה לא נחשב". דווקא האבחון הוא שחוסך זמן — בלעדיו לומדים הכל מאפס.</div>`},
{n:2,title:"למה צריך הובלה?",goal:"לבנות תמונת מערכת: מי מספק מה ולמי",dur:"25–35 דקות",lab:"diffusion",success:"אתה מסביר בדקה אחת למה דיפוזיה לבדה לא מספיקה לגוף רב-תאי גדול",
lesson:`<h3>שאלה להתחיל איתה</h3>
<p>אמבה היא יצור חד-תאי שחי במים. כל מה שהיא צריכה — חמצן ומזון — נכנס אליה ישירות מהמים ב<b>דיפוזיה</b> (מעבר חומרים מריכוז גבוה לריכוז נמוך). אז למה אתה, עם טריליוני תאים, לא יכול לחיות ככה?</p>
<h3>ההסבר</h3>
<p>דיפוזיה עובדת מצוין על <b>מרחקים קצרים מאוד</b> — פחות ממילימטר. ברגע שהגוף גדול, רוב התאים רחוקים מהסביבה החיצונית. תא שריר בשריר הירך שלך לא רואה אוויר ולא רואה אוכל. הוא חייב שמישהו יביא לו חמצן וגלוקוז וייקח ממנו פחמן דו-חמצני ופסולת. זו בדיוק העבודה של <b>מערכת ההובלה</b>: לב ששואב, דם שנושא, וכלי דם שהם הכבישים.</p>
<h3>מי עובד עם מי?</h3>
<ul>
<li><b>מערכת הנשימה</b> — מכניסה חמצן לדם (בריאות) ומוציאה פחמן דו-חמצני.</li>
<li><b>מערכת העיכול</b> — מפרקת מזון; הסוכרים והחומרים המומסים נספגים לדם.</li>
<li><b>מערכת ההובלה</b> — מחלקת את הכל לכל תא ואוספת פסולת.</li>
<li><b>מערכת ההפרשה</b> — מסננת את הפסולת מהדם (כליות) ומוציאה אותה.</li>
</ul>
<h3>דוגמה פתורה</h3>
<p><b>שאלה:</b> תא בקצה האצבע זקוק לחמצן. מדוע הדיפוזיה מהאוויר לא פותרת את הבעיה?</p>
<p><b>פתרון:</b> האוויר רחוק מהתא סנטימטרים רבים, ודיפוזיה יעילה רק על פחות ממילימטר. לכן החמצן נכנס לדם בריאות, ומערכת ההובלה מביאה אותו עד נים ליד התא — ורק שם, על מרחק מיקרוסקופי, הדיפוזיה משלימה את העבודה.</p>
<div class="callout warn"><b>טעות נפוצה:</b> "מערכת ההובלה מייצרת אנרגיה". לא! היא רק <b>מובילה</b>. האנרגיה נוצרת בתאים עצמם בתהליך הנשימה התאית, ולשם כך הם צריכים חמצן וגלוקוז.</div>`},
{n:3,title:"לב וכלי דם",goal:"להתאים מבנה לתפקיד: לב, עורק, וריד, נים",dur:"25–35 דקות",lab:"vessels",success:"80% הצלחה במשחק 'מי אני?' בלי בנק מילים, כולל הסבר למה 'עורק = דם מחומצן' שגוי",
lesson:`<h3>הלב — המשאבה הכפולה</h3>
<p>בלב ארבעה חללים: שתי <b>עליות</b> (ימנית ושמאלית) שמקבלות דם, ושני <b>חדרים</b> (ימני ושמאלי) ששואבים דם החוצה. <b>מחיצה</b> מפרידה בין הצד הימני לשמאלי, ו<b>מסתמים</b> דואגים שהדם יזרום בכיוון אחד בלבד. בכל <b>פעימה</b> הלב מתכווץ ודוחף דם; מספר הפעימות בדקה הוא <b>קצב הלב</b>, ואת תוצאתו מרגישים ב<b>דופק</b>.</p>
<h3>שלושה סוגי כלי דם — מבנה שמתאים לתפקיד</h3>
<table class="cmp"><tr><th>כלי הדם</th><th>תפקיד</th><th>איך המבנה מתאים?</th></tr>
<tr><td><b>עורק</b></td><td>מוביל דם <b>מהלב</b> לאיברים</td><td>דופן עבה, שרירית וגמישה — עומדת בלחץ הגבוה של כל פעימה</td></tr>
<tr><td><b>וריד</b></td><td>מחזיר דם <b>אל הלב</b></td><td>דופן דקה יותר, לחץ נמוך, <b>מסתמים</b> מונעים זרימה לאחור (במיוחד ברגליים)</td></tr>
<tr><td><b>נים</b></td><td>חילוף חומרים בין הדם לתאים</td><td>דופן בעובי תא אחד + רשת ענפה ליד כל תא — החומרים עוברים בקלות</td></tr></table>
<h3>דוגמה פתורה</h3>
<p><b>שאלה:</b> מדוע דופן החדר השמאלי עבה יותר מדופן החדר הימני?</p>
<p><b>פתרון:</b> החדר הימני שואב רק לריאות הסמוכות, ואילו החדר השמאלי שואב לכל הגוף — מהאצבעות ועד הראש. עבודה גדולה יותר דורשת שריר חזק יותר, ולכן דופן עבה יותר. מבנה מתאים לתפקיד.</p>
<div class="callout err"><b>הטעות הכי נפוצה בנושא:</b> "עורק תמיד נושא דם עשיר בחמצן". <b>שגוי!</b> ההגדרה של עורק היא לפי <b>כיוון הזרימה</b> — דם שיוצא מהלב. <b>עורק הריאה</b> נושא דם דל חמצן מהלב אל הריאות, ועדיין נקרא עורק. ועוד אחת: דם בורידים אינו כחול — הכחול באיורים הוא רק מוסכמה.</div>`},
{n:4,title:"מסלול הדם",goal:"להבין את שני המחזורים: הקטן והגדול",dur:"25–35 דקות",lab:"bloodpath",success:"מסלול מלא בעל-פה בלי לדלג על ריאות או גוף, ובלי להסתמך רק על צבעים",
lesson:`<h3>שני מעגלים, משאבה אחת</h3>
<p>הדם נע בשני מעגלים שמתחברים בלב:</p>
<ul>
<li><b>המחזור הקטן (הריאתי):</b> חדר ימין ← עורק הריאה ← ריאות (הדם נטען בחמצן ומשחרר פחמן דו-חמצני) ← ורידי הריאה ← עלייה שמאלית.</li>
<li><b>המחזור הגדול (המערכתי):</b> חדר שמאל ← אבי העורקים ← עורקים ← נימים בכל רקמות הגוף (נמסר חמצן ומזון, נאספת פסולת) ← ורידים ← וריד נבוב ← עלייה ימנית.</li>
</ul>

lesson:`<h3>מהי דיות?</h3>
<p><b>דיות (Transpiration)</b> היא איבוד מים בצורת אדים דרך <b>הפיוניות</b> — פתחים זעירים בעלים. זה נשמע כמו בזבוז, אבל זה בדיוק המנוע של הובלת המים: כשמים מתאדים מהעלה, נוצרת "משיכה" שמושכת עוד מים בעצה מהשורשים — כמו שתייה דרך קשית.</p>
<h3>מאזן מים</h3>
<p>הצמח חייב לאזן: קליטת מים בשורש מול איבוד מים בדיות. ביום חם ויבש הדיות מואצת; אם הקליטה לא מספקת — התאים מאבדים נפח והצמח <b>נובל</b>. הפיוניות נסגרות חלקית כדי לצמצם איבוד מים.</p>
<h3>מה מאיץ את הדיות?</h3>
<ul><li>חום גבוה · רוח · לחות נמוכה (אוויר יבש) · אור חזק</li></ul>
<h3>איך חושבים כמו חוקרים?</h3>
<p>ניסוי קלאסי: עוטפים עלה בשקית ניילון שקופה וקושרים סביב הגבעול. אחרי זמן מה מופיעות <b>טיפות מים על דופן השקית</b>. זו <b>תוצאה</b>. ה<b>מסקנה</b> היא: העלה מאבד מים באדוי — כלומר מתקיימת דיות. שימו לב להבדל: תוצאה = מה שראינו; מסקנה = מה שהסקנו ממנה.</p>
<h3>דוגמה פתורה</h3>
<p><b>שאלה:</b> בשני עציצים זהים כיסו עלים בעציץ א' בשקית ובעציץ ב' לא. בעציץ ב' נובל מהר יותר ביום חם. הסבר.</p>
<p><b>פתרון:</b> העלים החשופים מאבדים מים בדיות מהירה, וקליטת המים לא מספקת — לכן העציץ נובל. בעציץ א' השקית צמצמה את איבוד המים.</p>

function renderQuestion(q,box,opts={}){
  const card=document.createElement("div");
  card.className="qcard";card.dataset.qid=q.id;
  const st=S.answers[q.id];
  card.innerHTML=`<div class="qmeta">${pillsFor(q)}</div><div class="qtext">${esc(q.q)}</div>`;
  const body=document.createElement("div");card.appendChild(body);
  const actions=document.createElement("div");actions.className="q-actions";card.appendChild(actions);
  let hintsShown=0;
  function addHintBtn(){
    if(q.hints&&hintsShown<q.hints.length){
      const b=document.createElement("button");b.className="btn-line";b.textContent=`💡 רמז ${hintsShown+1}`;
      b.onclick=()=>{const h=document.createElement("div");h.className="hint-box";h.textContent="💡 "+q.hints[hintsShown];card.appendChild(h);hintsShown++;mark(q.id,{hints:(S.answers[q.id]?.hints||0)+1});b.remove();addHintBtn();};
      actions.appendChild(b);
    }
  }
  function finish(ok,self=false){
    const prev=S.answers[q.id]||{tries:0};
    S.answers[q.id]={tries:prev.tries+1,ok:ok||(prev.ok&&self),hints:prev.hints||0,self:!!self};
    if(prev.ok)S.answers[q.id].ok=true;
    save();card.classList.add(ok?"answered-correct":"answered-wrong");
    if(opts.onDone)opts.onDone(q,ok);
  }
  if(q.type==="open"){
    const ta=document.createElement("textarea");ta.className="ans";ta.placeholder="כתוב כאן את התשובה שלך במילים שלך...";body.appendChild(ta);
    const bModel=document.createElement("button");bModel.className="btn-primary";bModel.textContent="הצג תשובת מופת והשווה";
    bModel.onclick=()=>{
      bModel.remove();
      const m=document.createElement("div");m.className="explain";m.innerHTML=`<b>תשובת מופת:</b><br>${esc(q.model)}<br><br><b>הסבר:</b> ${esc(q.explain)}`;card.appendChild(m);
      const row=document.createElement("div");row.className="q-actions";
      const ok1=document.createElement("button");ok1.className="btn-good";ok1.textContent="✅ צדקתי בעיקרון";
      const ok2=document.createElement("button");ok2.className="btn-line";ok2.textContent="❌ טעיתי / פספסתי";
      ok1.onclick=()=>{row.remove();finish(true,true);};
      ok2.onclick=()=>{row.remove();finish(false,true);};
      row.append(ok1,ok2);
      card.appendChild(row);
    };
    actions.appendChild(bModel);addHintBtn();
  }else{
    const wrap=document.createElement("div");wrap.className="opts";
    const letters=["א","ב","ג","ד","ה"];
    q.opts.forEach((op,i)=>{
      const b=document.createElement("button");b.className="opt";
      b.innerHTML=`<span class="letter">${letters[i]}.</span><span>${esc(op)}</span>`;
      b.onclick=()=>{
        const ok=i===q.answer;
        wrap.querySelectorAll(".opt").forEach((el,j)=>{el.classList.add("disabled");el.onclick=null;
          if(j===q.answer)el.classList.add("correct");if(j===i&&!ok)el.classList.add("wrong");});
        const fb=document.createElement("div");fb.className="feedback "+(ok?"good":"bad");
        fb.innerHTML=(ok?"<b>נכון! </b>":"<b>לא בדיוק. </b>")+esc(q.why[i])+
          (ok?"":`<div class="why-wrong"><b>למה ${letters[q.answer]} נכונה?</b> ${esc(q.why[q.answer])}</div>`);
        card.appendChild(fb);
        const ex=document.createElement("div");ex.className="explain";ex.innerHTML=`<b>להבין ולזכור:</b> ${esc(q.explain)}`;card.appendChild(ex);
        finish(ok);
      };
      wrap.appendChild(b);
    });
    body.appendChild(wrap);addHintBtn();
  }
  box.appendChild(card);
  return card;
}
/* ---------- רץ שאלות עוקב (אבחון/מבחן) ---------- */
function runSequence(box,qs,title,onFinish){
  let i=0;const results=[];
  box.innerHTML=`<div class="card"><h2>${title}</h2>
    <div class="muted">שאלה <span id="sq-n">1</span> מתוך ${qs.length}</div>
    <div class="progress-wrap"><div class="progress-bar" id="sq-bar" style="width:${100/qs.length}%"></div></div>
    <div id="sq-slot"></div></div>`;
  const slot=box.querySelector("#sq-slot");
  function step(){
    box.querySelector("#sq-n").textContent=i+1;
    box.querySelector("#sq-bar").style.width=((i+1)/qs.length*100)+"%";
    slot.innerHTML="";
    renderQuestion(qs[i],slot,{onDone:(q,ok)=>{
      results.push({q,ok});
      const nb=document.createElement("button");nb.className="btn-primary";
      nb.textContent=i+1<qs.length?"השאלה הבאה ⬅":"לתוצאות ⬅";
      nb.style.marginTop="10px";
      nb.onclick=()=>{i++;if(i<qs.length)step();else onFinish(results);};
      slot.appendChild(nb);
    }});
  }
  step();
}

function finishDiagnostic(results){
  const domains={},topics={};
  let ok=0;
  results.forEach(({q,ok:o})=>{
    if(o)ok++;
    domains[q.skill]=domains[q.skill]||{ok:0,n:0};domains[q.skill].n++;if(o)domains[q.skill].ok++;
    topics[q.topic]=topics[q.topic]||{ok:0,n:0};topics[q.topic].n++;if(o)topics[q.topic].ok++;
  });
  const pct=Math.round(ok/results.length*100);
  const weak=Object.entries(domains).filter(([,v])=>v.ok/v.n<0.7).map(([k])=>k).join(" · ");
  const strong=Object.entries(domains).filter(([,v])=>v.ok/v.n>=0.7).map(([k])=>k).join(" · ");
  S.diag={pct,weak,strong,date:new Date().toLocaleDateString("he-IL"),resultsDetail:results.map(r=>({id:r.q.id,ok:r.ok}))};
  S.sessionsDone[1]=true;save();
  diagResultsView(S.diag.resultsDetail,S.diag,false);
}
function diagResultsView(detail,diag,cached){

    domains[q.skill]=domains[q.skill]||{ok:0,n:0};domains[q.skill].n++;if(ok)domains[q.skill].ok++;
    topics[q.topic]=topics[q.topic]||{ok:0,n:0};topics[q.topic].n++;if(ok)topics[q.topic].ok++;});
  const domRows=Object.entries(domains).map(([k,v])=>{const p=Math.round(v.ok/v.n*100);

  const topRows=Object.entries(topics).map(([k,v])=>{const p=Math.round(v.ok/v.n*100);
    return `<div class="domain-row"><span class="lbl">${TOPIC_ICON[k]} ${TOPIC_NAME[k]}</span><div class="bar"><div class="fill" style="width:${p}%;background:${p>=70?"var(--good)":"var(--accent)"}"></div></div><span class="pct">${v.ok}/${v.n}</span></div>`;}).join("");
  const rec=[];

    <div class="callout">לכל שאלה שטעית בה, סמן לעצמך במחברת: <b>לא ידעתי / התבלבלתי / לא הבניתי את השאלה</b>. זה יכתיב איך לתקן.</div>

let examTimer=null;
function startExam(){
  const pick=(arr,n)=>[...arr].sort(()=>Math.random()-.5).slice(0,n);
  const bank=QUESTIONS.filter(q=>!q.diag);
  const qs=[...pick(bank.filter(q=>q.topic==="adam"),6),...pick(bank.filter(q=>q.topic==="tzemach"),3),...pick(bank.filter(q=>q.topic==="skills"),3)].sort(()=>Math.random()-.5);
  const zone=$("#exam-zone");
  let secs=25*60;
  zone.innerHTML=`<div class="card"><h2>⏱ מבחן סימולציה</h2>
    <div class="timer" id="ex-timer">25:00</div>
    <div class="muted">12 שאלות · בלי חומר פתוח · בהצלחה!</div><div id="ex-slot"></div></div>`;
  clearInterval(examTimer);
  examTimer=setInterval(()=>{secs--;const el=$("#ex-timer");if(!el){clearInterval(examTimer);return;}
    el.textContent=`${String(Math.floor(secs/60)).padStart(2,"0")}:${String(secs%60).padStart(2,"0")}`;
    if(secs<=0){clearInterval(examTimer);el.textContent="⏰ הזמן נגמר!";}},1000);
  runSequence($("#ex-slot"),qs,"מבחן סימולציה",(results)=>{
    clearInterval(examTimer);
    const ok=results.filter(r=>r.ok).length;
    const pct=Math.round(ok/results.length*100);
    if(S.examBest===null||pct>S.examBest)S.examBest=pct;
    S.sessionsDone[10]=true;save();
    const byTopic={};
    results.forEach(({q,ok:o})=>{byTopic[q.topic]=byTopic[q.topic]||{ok:0,n:0};byTopic[q.topic].n++;if(o)byTopic[q.topic].ok++;});
    const rows=Object.entries(byTopic).map(([k,v])=>{const p=Math.round(v.ok/v.n*100);
      return `<div class="domain-row"><span class="lbl">${TOPIC_ICON[k]} ${TOPIC_NAME[k]}</span><div class="bar"><div class="fill" style="width:${p}%;background:${p>=70?"var(--good)":"var(--accent)"}"></div></div><span class="pct">${v.ok}/${v.n}</span></div>`;}).join("");
    const wrong=results.filter(r=>!r.ok);
    $("#exam-zone").innerHTML=`<div class="card">
      <div class="result-hero"><div class="big">${pct}%</div>
      <div class="muted">${pct>=80?"🏆 מוכן למשימה! כל הכבוד!":pct>=60?"כמעט שם — תקן את הטעויות ונסה שוב בעוד יום-יומיים.":"שווה לחזור למפגשים החלשים ואז לנסות שוב."}</div></div>
      ${rows}
      ${wrong.length?`<h3>תיקון טעויות — שלב חובה!</h3>
      <p>לכל שאלה שטעית, השלם במילים שלך: <b>"חשבתי ש..., אבל נכון ש..., כי..."</b> ואז קרא את ההסבר:</p>
      ${wrong.map(({q})=>`<div class="callout err"><b>${q.q}</b><br>✅ ${q.type==="open"?q.model:"התשובה הנכונה: "+q.opts[q.answer]}<br><span class="muted">${q.explain}</span></div>`).join("")}
      <div class="muted">בדוק: האם אותה טעות חזרה פעמיים על אותו עיקרון? אם כן — זה הסימן לחזור למפגש של הנושא.</div>`:`<div class="callout">מבחן נקי בלי טעויות! אתה מוכן. 🎉</div>`}
      <div class="q-actions"><button class="btn-primary" onclick="startExam()">↺ מבחן נוסף</button>
      <button class="btn-line" onclick="go('sessions')">📚 חזרה למפגשים</button></div>
    </div>`;
    window.scrollTo({top:0,behavior:"smooth"});
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("active",s.id==="page-"+page));
  ({home:renderHome,diagnostic:renderDiagnostic,sessions:renderSessions,practice:renderPractice,sim:renderSim,progress:renderProgress})[page]();
  window.scrollTo({top:0});
}
function doExport(){
  const blob=new Blob([JSON.stringify({app:"hovala",v:1,data:S},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="hovala-progress.json";a.click();URL.revokeObjectURL(a.href);
}
function applyTheme(){document.documentElement.dataset.theme=S.theme;$("#btn-theme").textContent=S.theme==="dark"?"☀️":"🌙";}
function renderAll(){applyTheme();
  ({home:renderHome,diagnostic:renderDiagnostic,sessions:renderSessions,practice:renderPractice,sim:renderSim,progress:renderProgress});
  renderHome();renderDiagnostic();renderSessions();renderPractice();renderSim();renderProgress();}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.page);});
$("#btn-theme").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";save();applyTheme();};
$("#btn-export").onclick=doExport;
$("#btn-import").onclick=()=>$("#import-file").click();
$("#import-file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);
    if(j.data&&j.data.answers){S=Object.assign({theme:"light",answers:{},sessionsDone:{},diag:null,examBest:null},j.data);save();renderAll();go("progress");alert("ההתקדמות יובאה בהצלחה! ✅");}
    else alert("הקובץ לא נראה כמו קובץ התקדמות של האפליקציה.");}catch(err){alert("שגיאה בקריאת הקובץ.");}};
  r.readAsText(f);e.target.value="";
});
const style2=document.createElement("style");
style2.textContent=`
@keyframes flow{to{stroke-dashoffset:-36}}
.flow-anim{animation:flow 1.2s linear infinite}
@keyframes flowrev{to{stroke-dashoffset:36}}
.flow-anim-rev{animation:flowrev 1.2s linear infinite}
@keyframes vaporUp{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-34px)}}
.vapor{animation:vaporUp 2.4s ease-in infinite}`;
document.head.appendChild(style2);
renderAll();
</script>
</body>
